name: Build MedQB APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reconstruct Android project
        run: |
          mkdir -p app/src/main/java/jp/medqb/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp build.gradle app/build.gradle

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/jp/medqb/app/MainActivity.java
          cp index.html app/src/main/assets/index.html
          cp styles.xml app/src/main/res/values/styles.xml

          cp ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedQB-APK
          path: app/build/outputs/apk/debug/app-debug.apk
